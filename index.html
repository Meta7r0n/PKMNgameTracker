<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ef4444">
<title>Pokemon Game Completion Tracker V0.11 Region Expansion Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.boot{max-width:560px;border:1px solid rgba(250,204,21,.4);border-radius:24px;background:linear-gradient(135deg,#1d4ed8,#7c3aed,#111827);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{font-size:1.25rem;margin:0 0 8px;color:#fff3a4}.bar{height:12px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:16px}.fill{height:100%;width:65%;background:#ffcb05;animation:pulse 1s infinite alternate}@keyframes pulse{to{width:100%}}p{color:#dbeafe;line-height:1.45;font-weight:700}</style>
</head>
<body>
<div class="boot"><h1>Loading V0.11 region expansion lab…</h1><p>Starting from V0.10 stable and adding Johto/region expansion groundwork.</p><div class="bar"><div class="fill"></div></div></div>
<script>
(async function(){
  const stableUrl='https://raw.githubusercontent.com/Meta7r0n/PKMNgameTracker/v0.10-stable/index.html';
  try{
    let source=await fetch(stableUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('V0.10 stable build fetch failed');return r.text();});
    source=source.replace('Pokemon Game Completion Tracker V0.10 Achievement Polish Lab','Pokemon Game Completion Tracker V0.11 Region Expansion Lab');
    source=source.replace('Loading V0.10 achievement polish lab…','Loading V0.11 region expansion lab…');
    source=source.replace('Starting from V0.9.5 stable and adding smarter achievement logic.','Starting from V0.10 stable and adding Johto/region expansion groundwork.');
    source=source.replaceAll('V0.10','V0.11');
    source=source.replaceAll('ACHIEVEMENT POLISH LAB','REGION EXPANSION LAB');
    source=source.replaceAll('Achievement polish lab','Region expansion lab');
    source=source.replace('V0.11 keeps the stable Binder/export flow and adds safe manual achievement detection.','V0.11 keeps Kanto stable and adds region/game expansion planning groundwork.');
    source=source.replace('Achievement logic can summarize progress and sync polished ribbons into the latest HOF/Binder card.','Region groundwork prepares Johto support, region badge cases, Binder filters, and future per-game saves.');
    const oldLine="html=html.replace('</body>','<scr'+'ipt>('+runtimePatch.toString()+')();</scr'+'ipt><scr'+'ipt src=\"./binder-combined-export-v095.js?v=095clean2\"></scr'+'ipt><scr'+'ipt src=\"./achievement-polish-safe-v010e.js?v=010e2\"></scr'+'ipt><scr'+'ipt src=\"./credits-expanded-v010.js?v=010credits1\"></scr'+'ipt></body>');";
    const newLine="html=html.replace('</body>','<scr'+'ipt>('+runtimePatch.toString()+')();</scr'+'ipt><scr'+'ipt src=\"./binder-combined-export-v095.js?v=095clean2\"></scr'+'ipt><scr'+'ipt src=\"./achievement-polish-safe-v010e.js?v=010e2\"></scr'+'ipt><scr'+'ipt src=\"./credits-expanded-v010.js?v=010credits1\"></scr'+'ipt><scr'+'ipt src=\"./region-expansion-v011.js?v=011a\"></scr'+'ipt></body>');";
    if(!source.includes(oldLine))throw new Error('V0.10 injection point not found');
    source=source.replace(oldLine,newLine);
    document.open();document.write(source);document.close();
  }catch(err){
    document.querySelector('.boot').innerHTML='<h1>Startup error</h1><p>'+String(err.message||err)+'</p><p>Use v0.10-stable if this persists.</p>';
  }
})();
</script>
</body>
</html>
