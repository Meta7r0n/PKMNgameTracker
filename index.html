(async function(){

    html=html.replace("ctx.fillText('meta7r0n.github.io/PKMNgameTracker',76,H-42);","ctx.fillText('meta7r0n.github.io/PKMNgameTracker',76,H-80);");

ame);const id=POKE_IDS[key];if(!id)return'';return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-i/red-blue/transparent/'+id+'.png';}function renderTeamSlot(i,name){const label=esc(name||'Empty slot');const url=teamSpriteUrl(name);const img=url?'<img class=\"tc-team-sprite\" src=\"'+url+'\" alt=\"'+label+'\" loading=\"lazy\" onerror=\"this.remove()\">':'';return '<div class=\"tc-slot\"><em>'+(i+1)+'.</em>'+img+'<span class=\"tc-slot-name\">'+label+'</span></div>';}":
    html=html.replace("function hofPlus(o){let arr=hof.slice();if(o&&o.entry)arr=arr.filter(x=>x.id!==o.entry.id).concat([o.entry]);return arr;}", "function hofPlus(o){let arr=hof.slice();if(o&&o.entry)arr=arr.filter(x=>x.id!==o.entry.id).concat([o.entry]);return arr;}"+spriteHelpers);
    html=html.replace("${[0,1,2,3,4,5].map(i=>`<div class=\"tc-slot\"><em>${i+1}.</em>${esc(team[i]||'Empty slot')}</div>`).join('')}", "${[0,1,2,3,4,5].map(i=>renderTeamSlot(i,team[i])).join('')}");
    html=html.replace("ctx.fillStyle='white';ctx.font='800 24px system-ui';fitText(ctx,team[i]||'Empty slot',x+64,y+37,330,28,1);", "const pokeName=team[i]||'Empty slot';const pokeUrl=teamSpriteUrl(pokeName);if(pokeUrl){ctx.save();ctx.shadowColor='rgba(255,243,164,.70)';ctx.shadowBlur=22;ctx.fillStyle='rgba(255,255,255,.28)';roundRect(ctx,x+48,y+3,70,52,16,true,false);ctx.restore();ctx.save();ctx.fillStyle='rgba(255,243,164,.58)';roundRect(ctx,x+53,y+8,60,42,14,true,false);ctx.restore();const pokeImg=await loadImage(pokeUrl);if(pokeImg)ctx.drawImage(pokeImg,x+55,y+1,58,58);}ctx.fillStyle='white';ctx.font='800 24px system-ui';fitText(ctx,pokeName,pokeUrl?x+132:x+64,y+37,pokeUrl?254:330,28,1);");

    const extraCss = ".tc-banner-bg{position:absolute;left:0;right:0;top:0;width:100%;height:255px;object-fit:cover;opacity:.18;filter:blur(1px) saturate(1.15);mix-blend-mode:screen;z-index:1;pointer-events:none}.trainer-card:after{content:'';position:absolute;left:0;right:0;top:0;height:285px;background:linear-gradient(180deg,rgba(15,23,42,.55),rgba(15,23,42,.18),transparent);z-index:1;pointer-events:none}.tc-idbar,.tc-body{z-index:2}.binder-empty{border:1px dashed rgba(255,255,255,.24);border-radius:18px;padding:18px;text-align:center;background:rgba(255,255,255,.05);color:#cbd5e1}.binder-list{display:grid;gap:12px;margin:12px 0}.binder-tile{border:1px solid rgba(250,204,21,.35);border-radius:20px;padding:12px;background:linear-gradient(135deg,rgba(250,204,21,.14),rgba(255,255,255,.05));display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}.binder-thumb{width:76px;height:96px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}.binder-title{font-weight:1000;color:#fff}.binder-meta{font-size:.82rem;color:#cbd5e1;line-height:1.35;margin:4px 0}.binder-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.binder-card-view{display:none;margin-top:12px}.binder-card-view.open{display:block}.binder-flip-shell{perspective:1300px}.binder-flip-card{position:relative;min-height:650px;transform-style:preserve-3d;transition:transform .45s ease}.binder-flip-card.flipped{transform:rotateY(180deg)}.binder-face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid rgba(250,204,21,.75);border-radius:26px;overflow:hidden;background:linear-gradient(135deg,#1e3a8a,#7c3aed,#111827);box-shadow:0 18px 42px rgba(0,0,0,.35);padding:14px;color:white}.binder-back{transform:rotateY(180deg);background:linear-gradient(135deg,#7f1d1d,#92400e,#111827)}.binder-face-head{background:linear-gradient(90deg,#ffcb05,#fff3a4);color:#172554;margin:-14px -14px 12px;padding:9px 12px;font-weight:1000;display:flex;justify-content:space-between;gap:8px}.binder-hero{height:245px;border-radius:18px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);object-fit:cover;width:100%;margin-bottom:10px}.binder-moves{display:grid;gap:8px;margin-top:10px}.binder-move{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);border-radius:15px;padding:9px}.binder-move b{display:block;color:#fff3a4}.binder-move span{display:block;color:#dbeafe;font-size:.78rem;line-height:1.3}.binder-statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.binder-stat{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);border-radius:14px;padding:8px;text-align:center}.binder-stat b{display:block;color:#fff3a4}.binder-stat span{font-size:.68rem;color:#dbeafe;font-weight:900}.binder-team{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.binder-slot{border-radius:14px;background:rgba(255,255,255,.10);padding:8px;color:#e0f2fe;font-weight:850;font-size:.82rem}.binder-note{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:10px;color:#e5e7eb;font-size:.82rem;line-height:1.35;margin-top:8px}.binder-claim-hint{font-size:.78rem;color:#fff3a4;margin-top:6px;font-weight:850}@media(max-width:720px){.binder-tile{grid-template-columns:58px 1fr}.binder-thumb{width:58px;height:74px}.binder-flip-card{min-height:720px}.binder-team{grid-template-columns:1fr}.binder-actions{display:grid}.binder-statrow{grid-template-columns:1fr 1fr}}";
    html=html.replace('</style>',extraCss+'</style>');
    html=html.replace('</body>','<scr'+'ipt>('+runtimePatch.toString()+')();</scr'+'ipt></body>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){

  function runtimePatch(){
    function applyBannerPreview(){document.querySelectorAll('.trainer-card').forEach(function(card){if(card.querySelector('.tc-banner-bg'))return;var srcImg=card.querySelector('.tc-photo img');if(!srcImg||!srcImg.src)return;var banner=document.createElement('img');banner.className='tc-banner-bg';banner.alt='';banner.setAttribute('aria-hidden','true');banner.src=srcImg.src;card.insertBefore(banner,card.firstChild);});}
    setInterval(applyBannerPreview,800);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',applyBannerPreview);else applyBannerPreview();
    const BINDER_KEY='pokemonGameCompletionTracker.hofBinder.v0.9.1',HOF_KEY='pokemonGameCompletionTracker.hallOfFame.v0.5.lab';
    function readHof(){try{return JSON.parse(localStorage.getItem(HOF_KEY)||'[]')||[]}catch(e){return[]}}
    function readBinder(){try{return JSON.parse(localStorage.getItem(BINDER_KEY)||'[]')||[]}catch(e){return[]}}
    function saveBinder(cards){localStorage.setItem(BINDER_KEY,JSON.stringify(cards))}
    function safe(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
    function gameTitle(id){return ({rby:'Pokemon Red / Blue / Yellow',frlg:'Pokemon FireRed / LeafGreen',letsgo:'Pokemon Lets Go Pikachu / Eevee'})[id]||id||'Pokemon Run'}
    function getMoves(e){const a=new Set(e.achievements||[]),b=e.badges||[],team=(e.team||[]).filter(Boolean);let pool=[];function add(id,name,type,text){pool.push({id,name,type,text})}if(b.length>=8)add('badge-storm','Badge Storm','Main','Earned every Kanto badge and lit up the badge case.');if(a.has('kanto-champion'))add('champion-roar','Champion’s Roar','Main','Claimed the title and conquered the League.');if(a.has('elite-crusher'))add('elite-crush','Elite Crush','Main','Cleared the League gauntlet with no turning back.');if(a.has('gotta-catch-em-all')||a.has('professors-witness'))add('dex-sweep','Dex Sweep','Dex','Built a serious record for Professor Oak.');if(a.has('trade-circle-complete')||a.has('link-cable-spark'))add('link-master','Link Master','Trade','Used the cable ritual to complete special evolutions.');if(a.has('legendary-bird-keeper')||a.has('cerulean-cave-victor'))add('legend-call','Legend Call','Legendary','Tracked powerful legendary encounters across Kanto.');if(a.has('myth-seeker')||a.has('event-archivist'))add('myth-trace','Myth Trace','Mythical','Followed the rare signal beyond the normal path.');if(a.has('missingno-researcher')||a.has('glitch-professor'))add('glitch-shift','Glitch Shift','Glitch','Touched the strange edges of cartridge history.');if(a.has('nuzlocke-survivor')||a.has('hardcore-ruleset'))add('iron-will','Iron Will','Challenge','Survived a self-imposed path with stricter rules.');if(a.has('full-team-logged')||team.length>=6)add('team-preserved','Team Preserved','Archive','Recorded the full squad for the Hall of Fame.');if(a.size>=8)add('ribbon-stack','Ribbon Stack','Archive','Stacked a deep ribbon record across the run.');if(e.image)add('photo-finish','Photo Finish','Archive','Preserved the moment with a Hall of Fame image.');if(!pool.length)add('first-step','First Step','Journey','The run has entered the archive and started its legacy.');return pool.slice(0,4)}
    function archetype(e){const a=new Set(e.achievements||[]);if(a.has('glitch-professor')||a.has('missingno-researcher'))return'Glitch Hunter';if(a.has('gotta-catch-em-all')||a.has('diploma-earned'))return'Dex Master';if(a.has('legendary-bird-keeper')||a.has('cerulean-cave-victor'))return'Legend Seeker';if(a.has('trade-circle-complete'))return'Link Specialist';if(a.has('nuzlocke-survivor')||a.has('hardcore-ruleset'))return'Challenge Runner';if((e.badges||[]).length>=8)return'Champion Trainer';return'Run Archivist'}
    function makeCard(e){return{id:'binder_'+Date.now(),hofEntryId:e.id,created:Date.now(),playerName:e.nickname||'Champion',title:e.nickname||'Champion',archetype:archetype(e),game:e.game,version:e.version,starter:e.starter,badges:e.badges||[],achievements:e.achievements||[],team:e.team||[],notes:e.notes||'',image:e.image||'',moves:getMoves(e)}}
    function claimCard(id){const e=readHof().find(x=>x.id===id);if(!e)return alert('HOF entry not found.');let cards=readBinder();if(cards.some(c=>c.hofEntryId===id)&&!confirm('This entry already has a binder card. Create another snapshot?'))return;cards.push(makeCard(e));saveBinder(cards);renderBinder();openBinder();}
    function addClaimButtons(){document.querySelectorAll('.trainer-card').forEach(function(card){if(card.querySelector('.hof-claim-binder'))return;const edit=card.querySelector('.hof-edit');if(!edit)return;const id=edit.dataset.id;const btn=document.createElement('button');btn.className='btn small gold hof-claim-binder';btn.type='button';btn.dataset.id=id;btn.textContent='Claim Binder Card';const actions=card.querySelector('.hof-small-actions');if(actions)actions.insertBefore(btn,actions.firstChild);});}
    function openBinder(){document.getElementById('binderDrawer').classList.add('open');document.body.style.overflow='hidden'}
    function closeBinder(){document.getElementById('binderDrawer').classList.remove('open');document.body.style.overflow=''}
    function renderTile(c){return '<div class="binder-tile"><img class="binder-thumb" src="'+(c.image||'')+'" onerror="this.style.display=\'none\'" alt=""><div><div class="binder-title">'+safe(c.title)+'</div><div class="binder-meta">'+safe(c.archetype)+' · '+safe(gameTitle(c.game))+'<br>'+safe(c.version||'')+' · Starter: '+safe(c.starter||'—')+'</div><div class="binder-actions"><button class="btn small gold binder-open-card" data-id="'+c.id+'" type="button">Open Card</button><button class="btn small danger binder-delete-card" data-id="'+c.id+'" type="button">Delete</button></div></div></div>'}
    function front(c){const team=(c.team||[]).filter(Boolean);return '<div class="binder-face binder-front"><div class="binder-face-head"><span>TRAINER CARD</span><span>FRONT</span></div><h2>'+safe(c.title)+'</h2><p>'+safe(c.archetype)+' · '+safe(gameTitle(c.game))+'<br>'+safe(c.version||'')+' · Starter: '+safe(c.starter||'—')+'</p><div class="binder-statrow"><div class="binder-stat"><b>'+(c.badges||[]).length+'/8</b><span>BADGES</span></div><div class="binder-stat"><b>'+team.length+'/6</b><span>TEAM</span></div><div class="binder-stat"><b>'+(c.achievements||[]).length+'</b><span>RIBBONS</span></div></div><h3>Hall of Fame Team</h3><div class="binder-team">'+[0,1,2,3,4,5].map(i=>'<div class="binder-slot">'+(i+1)+'. '+safe((c.team||[])[i]||'Empty slot')+'</div>').join('')+'</div>'+(c.notes?'<div class="binder-note">'+safe(c.notes)+'</div>':'')+'<p class="binder-claim-hint">Tap Flip or swipe to view the collectible back.</p></div>'}
    function back(c){return '<div class="binder-face binder-back"><div class="binder-face-head"><span>'+safe(c.playerName)+'</span><span>BACK</span></div><h2>'+safe(c.playerName)+'</h2><p>'+safe(c.archetype)+'</p>'+(c.image?'<img class="binder-hero" src="'+c.image+'" alt="Hall of Fame image">':'<div class="binder-hero" style="display:grid;place-items:center;color:#cbd5e1">No HOF image</div>')+'<div class="binder-moves">'+(c.moves||[]).map(m=>'<div class="binder-move"><b>'+safe(m.name)+' <small>· '+safe(m.type)+'</small></b><span>'+safe(m.text)+'</span></div>').join('')+'</div></div>'}
    function openCard(id){const c=readBinder().find(x=>x.id===id);if(!c)return;const view=document.getElementById('binderCardView');view.classList.add('open');view.innerHTML='<div class="binder-actions"><button class="btn gold" id="binderFlipBtn" type="button">Flip Card</button><button class="btn secondary" id="binderCloseCardBtn" type="button">Back to Binder</button></div><div class="binder-flip-shell"><div class="binder-flip-card" id="binderFlipCard">'+front(c)+back(c)+'</div></div>';let startX=0;const flip=document.getElementById('binderFlipCard');function doFlip(){flip.classList.toggle('flipped')}document.getElementById('binderFlipBtn').onclick=doFlip;document.getElementById('binderCloseCardBtn').onclick=function(){view.classList.remove('open');view.innerHTML=''};flip.addEventListener('touchstart',e=>startX=e.changedTouches[0].screenX,{passive:true});flip.addEventListener('touchend',e=>{if(Math.abs(e.changedTouches[0].screenX-startX)>45)doFlip()},{passive:true});view.scrollIntoView({behavior:'smooth',block:'start'})}
    function renderBinder(){const cards=readBinder();document.getElementById('binderCount').textContent=cards.length+' card'+(cards.length===1?'':'s');document.getElementById('binderList').innerHTML=cards.length?cards.slice().sort((a,b)=>b.created-a.created).map(renderTile).join(''):'<div class="binder-empty"><strong>No binder cards yet.</strong><br>Open Hall of Fame and tap Claim Binder Card on a saved entry.</div>'}
    function installBinder(){if(document.getElementById('binderDrawer'))return;const btn=document.getElementById('binderBtn');if(btn)btn.onclick=function(){renderBinder();openBinder()};document.body.insertAdjacentHTML('beforeend','<div class="drawer" id="binderDrawer"><div class="shade" id="binderShade"></div><aside class="panel hof-panel"><h2>HOF Binder</h2><p>Double-sided collectible cards claimed from saved Hall of Fame runs. Front side preserves the run summary. Back side uses the Hall of Fame image and generated accomplishment moves.</p><div class="hof-hero"><span class="hof-stamp">V0.9.1 BINDER MVP</span><p><b id="binderCount">0 cards</b> · Claim cards from saved Hall of Fame entries.</p></div><div id="binderList" class="binder-list"></div><div id="binderCardView" class="binder-card-view"></div><button class="btn secondary" id="closeBinderBtn" type="button">Close Binder</button></aside></div>');document.getElementById('closeBinderBtn').onclick=closeBinder;document.getElementById('binderShade').onclick=closeBinder;document.getElementById('binderList').onclick=function(e){const id=e.target.dataset.id;if(e.target.classList.contains('binder-open-card'))openCard(id);if(e.target.classList.contains('binder-delete-card')&&confirm('Delete this binder card snapshot?')){saveBinder(readBinder().filter(c=>c.id!==id));renderBinder();}};document.body.addEventListener('click',function(e){if(e.target.classList.contains('hof-claim-binder'))claimCard(e.target.dataset.id)});setInterval(addClaimButtons,900);addClaimButtons();renderBinder()}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',installBinder);else installBinder();
  }
})();
</script>
</body>
</html>
