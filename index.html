<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>PKMN Platform Rebuild V0.15.1</title>
<style>
:root{--bg:#0f172a;--panel:#111827;--panel2:#1e293b;--line:rgba(255,255,255,.13);--gold:#ffcb05;--gold2:#fff3a4;--txt:#f8fafc;--muted:#cbd5e1;--soft:#94a3b8;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(59,130,246,.28),transparent 32%),linear-gradient(135deg,#0f172a,#1e1b4b,#111827);color:var(--txt);font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh}.app{max-width:980px;margin:0 auto;padding:18px 14px 100px}.hero{border:1px solid rgba(250,204,21,.44);border-radius:28px;padding:18px;background:linear-gradient(135deg,rgba(37,99,235,.42),rgba(124,58,237,.26),rgba(15,23,42,.88));box-shadow:0 22px 70px rgba(0,0,0,.32);margin-bottom:14px}.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gold2);font-weight:1000}.hero h1{font-size:2rem;line-height:1.02;margin:6px 0}.hero p{color:#dbeafe;font-weight:800;line-height:1.35;margin:7px 0 0}.topbar,.quickbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:999px;min-height:44px;padding:10px 14px;font-weight:1000;font-size:.9rem}.btn:active{transform:translateY(1px)}.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#172554}.secondary{background:rgba(255,255,255,.10);color:white;border:1px solid var(--line)}.danger{background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(248,113,113,.35)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);padding:14px}.card h2,.card h3{margin:0 0 8px}.card p{color:var(--muted);font-weight:800;line-height:1.35}.menu-card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.pill{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:5px 8px;color:#e5e7eb;font-weight:900;font-size:.72rem}.panel{border:1px solid rgba(250,204,21,.45);border-radius:28px;padding:14px;background:radial-gradient(circle at 14% 0%,rgba(250,204,21,.16),transparent 34%),linear-gradient(135deg,rgba(15,23,42,.98),rgba(30,41,59,.94));box-shadow:0 18px 40px rgba(0,0,0,.25);margin-top:12px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.panel-title{font-weight:1000;color:var(--gold2);font-size:1.28rem;line-height:1.08}.count-pill{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#172554;border-radius:999px;padding:8px 11px;font-weight:1000;white-space:nowrap}.note,.empty{border:1px dashed rgba(250,204,21,.35);border-radius:16px;padding:10px;color:var(--muted);background:rgba(255,255,255,.045);font-weight:800;font-size:.82rem;line-height:1.35;margin:10px 0}.empty{text-align:center;padding:18px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.controls label{display:block;color:var(--muted);font-weight:1000;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.controls select,.controls input,.controls textarea,textarea{width:100%;padding:10px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:#111827;color:white;font-weight:850}.progress{height:12px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:16px;padding:10px;text-align:center}.stat b{display:block;color:var(--gold2);font-size:1.15rem}.stat span{display:block;color:var(--muted);font-weight:900;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.badge{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.07);padding:10px;text-align:center;color:var(--soft);font-weight:1000}.badge.done{color:#172554;background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold)}.badge small{display:block;font-size:.62rem;text-transform:uppercase}.section{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.055);padding:0;margin-top:10px;overflow:hidden}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:11px 10px;background:rgba(255,255,255,.04);border:0;color:var(--gold2);text-align:left;font-weight:1000;text-transform:uppercase;letter-spacing:.06em}.section-head span:last-child{font-size:.75rem;color:var(--muted);text-transform:none;letter-spacing:0}.section-body{padding:0 10px 10px}.section.collapsed .section-body{display:none}.meta{color:var(--soft);font-weight:850;font-size:.72rem;margin:7px 0 8px}.task{display:flex;align-items:flex-start;gap:9px;padding:9px;border-radius:13px;background:rgba(255,255,255,.055);margin-top:6px;color:#dbeafe;font-weight:850;line-height:1.25}.task input{width:22px;height:22px;accent-color:var(--gold);flex:0 0 auto;margin-top:0}.task.done{background:rgba(250,204,21,.10);color:var(--gold2)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.entry{border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.07);padding:11px;margin-top:10px}.entry b{color:white}.entry small{color:var(--soft);font-weight:850}.entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.mini{min-height:34px;padding:7px 10px;font-size:.78rem}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filter{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.08);color:white;font-weight:950;padding:8px 11px}.filter.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#172554;border-color:var(--gold)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#111827;border:1px solid rgba(250,204,21,.5);border-radius:999px;padding:10px 14px;color:white;font-weight:1000;opacity:0;pointer-events:none;transition:.25s;z-index:9999;max-width:92vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.hide{display:none!important}@media(max-width:760px){.grid,.controls,.stats,.actions{grid-template-columns:1fr}.badges{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:1.55rem}.app{padding:14px 10px 100px}.panel-head{align-items:stretch;flex-direction:column}.topbar .btn{flex:1 1 42%}.quickbar .btn{flex:1 1 100%}.entry-actions .btn{flex:1 1 100%}}
</style>
</head>
<body><div class="app" id="app"></div><div class="toast" id="toast"></div>
<script>
const KEYS={active:'pkmn.platform.activeRegion.v015',hof:'pkmn.platform.hof.entries.v015',binder:'pkmn.platform.binder.cards.v015',settings:'pkmn.platform.settings.v015',collapsed:'pkmn.platform.collapsed.v015',filter:'pkmn.platform.filter.v015'};
const REGIONS={
 kanto:{id:'kanto',name:'Kanto',title:'Pokemon Red / Blue / Yellow',games:['Red','Blue','Yellow'],console:'Game Boy',starters:['Bulbasaur','Charmander','Squirtle','Pikachu'],badges:['Boulder','Cascade','Thunder','Rainbow','Soul','Marsh','Volcano','Earth'],sections:{setup:['Choose version','Choose starter','Name rival','Get Pokédex from Professor Oak','Buy Poké Balls','Build first 6-party team'],journey:['Defeat Brock','Defeat Misty','Defeat Lt. Surge','Defeat Erika','Defeat Koga','Defeat Sabrina','Defeat Blaine','Defeat Giovanni'],rocket:['Clear Mt. Moon fossils','Clear Nugget Bridge','Clear Rocket Game Corner','Clear Pokémon Tower','Clear Silph Co.','Rescue Mr. Fuji','Get Master Ball'],league:['Pass Victory Road','Defeat Lorelei','Defeat Bruno','Defeat Agatha','Defeat Lance','Defeat Champion','Enter Hall of Fame'],collect:['Track version exclusives','Complete trade evolutions','Choose fossil and revive it','Get Eevee','Get Lapras','Get Hitmonlee or Hitmonchan','Catch both Snorlax encounters'],legends:['Catch Articuno','Catch Zapdos','Catch Moltres','Catch Mewtwo','Track Mew event/glitch note'],glitch:['MissingNo note','Item duplication note','Mew glitch note','Glitch City note'],archive:['Save Kanto HOF card','Claim Kanto Binder card','Export trainer card later']}},
 johto:{id:'johto',name:'Johto',title:'Pokemon Gold / Silver / Crystal',games:['Gold','Silver','Crystal','HeartGold','SoulSilver'],console:'Game Boy Color / DS',starters:['Chikorita','Cyndaquil','Totodile'],badges:['Zephyr','Hive','Plain','Fog','Storm','Mineral','Glacier','Rising'],sections:{setup:['Choose version','Choose starter','Name rival','Get Pokédex from Professor Oak','Deliver Mystery Egg','Get Map Card for Pokégear','Catch first route Pokémon','Build first 6-party team'],early:['Reach Violet City','Clear Sprout Tower','Earn Zephyr Badge','Receive and hatch Togepi Egg','Clear Ruins of Alph first puzzle','Clear Slowpoke Well','Earn Hive Badge','Clear Ilex Forest Farfetch’d puzzle','Reach Goldenrod'],mid:['Earn Plain Badge','Get SquirtBottle','Catch or defeat Sudowoodo','Explore Burned Tower','Release legendary beasts','Earn Fog Badge','Reach Cianwood','Get SecretPotion','Earn Storm Badge','Heal Amphy','Earn Mineral Badge'],late:['Clear Lake of Rage red Gyarados event','Clear Rocket Hideout','Earn Glacier Badge','Clear Radio Tower takeover','Reach Blackthorn','Clear Dragon’s Den','Earn Rising Badge','Receive Master Ball'],league:['Pass Victory Road','Defeat rival before League','Defeat Will','Defeat Koga','Defeat Bruno','Defeat Karen','Defeat Lance','Enter Johto Hall of Fame'],postgame:['Board S.S. Aqua','Arrive in Kanto','Fix Power Plant issue','Get Kanto Radio Card','Wake Snorlax','Earn all 8 Kanto postgame badges','Unlock Mt. Silver','Defeat Red'],legends:['Catch or track Raikou','Catch or track Entei','Catch Suicune / Crystal arc','Catch Lugia','Catch Ho-Oh','Track Celebi / GS Ball note','Catch Red Gyarados'],dex:['Track version exclusives','Track trade evolutions','Use breeding/daycare','Track baby Pokémon','Track happiness evolutions','Track time-of-day encounters','Catch Friday Lapras','Start Johto Living Dex'],archive:['Save Johto HOF card','Claim Johto Binder card later','Record Red battle team','Export Johto trainer card later']}}
};
let view='menu',active=localStorage.getItem(KEYS.active)||'kanto',hofFilter='all',binderFilter='all';
const $=id=>document.getElementById(id);const saveKey=id=>'pkmn.platform.region.'+id+'.progress.v015';
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||'')||f}catch(e){return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function allTasks(r){return Object.entries(r.sections).flatMap(([cat,list])=>list.map((text,i)=>({id:cat+'-'+i,cat,text})))}function pct(a,b){return b?Math.round(a/b*100):0}function title(s){return s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function shell(inner){$('app').innerHTML='<header class="hero"><div class="kicker">V0.15.1 platform stability lab</div><h1>PKMN Completion Platform</h1><p>Main menu first. Region modules second. Hall of Fame and Binder as shared platform engines.</p><div class="topbar"><button class="btn gold" onclick="go(\'menu\')">Main Menu</button><button class="btn secondary" onclick="go(\'regions\')">Region Map</button><button class="btn secondary" onclick="go(\'hof\')">HOF Archive</button><button class="btn secondary" onclick="go(\'binder\')">HOF Binder</button><button class="btn secondary" onclick="go(\'credits\')">Credits</button><button class="btn secondary" onclick="go(\'options\')">Options</button></div></header>'+inner}
function go(v,id){view=v;if(id){active=id;localStorage.setItem(KEYS.active,id)}render();window.scrollTo({top:0,behavior:'smooth'})}
function regionProgress(id){const r=REGIONS[id],st=read(saveKey(id),{}),tasks=allTasks(r),done=tasks.filter(t=>st[t.id]).length,badges=r.badges.filter(b=>st['badge-'+b]).length,total=tasks.length+r.badges.length;return{done,badges,total,complete:done+badges,percent:pct(done+badges,total),st}}
function menu(){const p=regionProgress(active);shell('<div class="grid"><div class="card menu-card"><div><h2>Region Map / Start Run</h2><p>Choose Kanto, Johto, or future regions from a clean front door.</p></div><button class="btn gold" onclick="go(\'regions\')">Open Region Map</button></div><div class="card menu-card"><div><h2>Hall of Fame Archive</h2><p>View saved runs by region/game.</p></div><button class="btn gold" onclick="go(\'hof\')">Open HOF</button></div><div class="card menu-card"><div><h2>HOF Binder</h2><p>Collect run cards across regions.</p></div><button class="btn gold" onclick="go(\'binder\')">Open Binder</button></div><div class="card menu-card"><div><h2>Credits / Tribute</h2><p>Project notes, Pokémon history tribute, and disclaimers.</p></div><button class="btn gold" onclick="go(\'credits\')">Open Credits</button></div><div class="card menu-card"><div><h2>Options / Data Tools</h2><p>Export, import, load all data, reset tools, and future settings.</p></div><button class="btn gold" onclick="go(\'options\')">Open Options</button></div><div class="card menu-card"><div><h2>Active Region</h2><p>'+REGIONS[active].name+' · '+REGIONS[active].title+'</p><div class="progress"><span style="width:'+p.percent+'%"></span></div><div class="pillrow"><span class="pill">'+p.percent+'%</span><span class="pill">'+p.badges+' badges</span><span class="pill">'+p.done+' tasks</span></div></div><button class="btn secondary" onclick="go(\'run\',active)">Resume Run</button></div></div>')}
function regions(){shell('<div class="grid">'+Object.values(REGIONS).map(r=>{const p=regionProgress(r.id);return '<div class="card"><h2>'+r.name+'</h2><p>'+r.title+' · '+r.console+'</p><div class="progress"><span style="width:'+p.percent+'%"></span></div><div class="pillrow"><span class="pill">'+p.percent+'%</span><span class="pill">'+p.badges+'/'+r.badges.length+' badges</span><span class="pill">'+p.done+' tasks</span></div><div class="pillrow">'+r.games.map(x=>'<span class="pill">'+x+'</span>').join('')+'</div><button class="btn gold" onclick="go(\'run\',\''+r.id+'\')">Load '+r.name+'</button></div>'}).join('')+'<div class="card"><h2>Hoenn</h2><p>Coming after Kanto/Johto platform is stable.</p><button class="btn secondary">Coming Soon</button></div><div class="card"><h2>Sinnoh</h2><p>Planned future expansion.</p><button class="btn secondary">Coming Soon</button></div></div>')}
function collapsed(id){return read(KEYS.collapsed,{})[active+'-'+id]}function toggleSection(id){let c=read(KEYS.collapsed,{});c[active+'-'+id]=!c[active+'-'+id];write(KEYS.collapsed,c);run()}
function run(){const r=REGIONS[active],st=read(saveKey(active),{}),tasks=allTasks(r),done=tasks.filter(t=>st[t.id]).length,badgeDone=r.badges.filter(b=>st['badge-'+b]).length,total=tasks.length+r.badges.length,complete=done+badgeDone,percent=pct(complete,total);shell('<div class="panel"><div class="panel-head"><div><div class="kicker">Region module</div><div class="panel-title">'+r.title+'</div></div><div class="count-pill">'+complete+' / '+total+'</div></div><div class="quickbar"><button class="btn secondary" onclick="go(\'menu\')">Back to Menu</button><button class="btn secondary" onclick="go(\'regions\')">Change Region</button><button class="btn secondary" onclick="collapseAll(false)">Open Sections</button><button class="btn secondary" onclick="collapseAll(true)">Collapse Sections</button></div><div class="note">'+r.name+' is rendered from a region module. Same layout, same save pattern, same HOF payload shape for every region.</div><div class="controls"><div><label>Version / Game</label><select id="version">'+r.games.map(g=>'<option '+(st.version===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div><div><label>Starter</label><select id="starter"><option>Unset</option>'+r.starters.map(s=>'<option '+(st.starter===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div></div><div class="progress"><span style="width:'+percent+'%"></span></div><div class="stats"><div class="stat"><b>'+percent+'%</b><span>Total</span></div><div class="stat"><b>'+badgeDone+'/'+r.badges.length+'</b><span>Badges</span></div><div class="stat"><b>'+done+'/'+tasks.length+'</b><span>Tasks</span></div><div class="stat"><b>'+Object.keys(r.sections).length+'</b><span>Sections</span></div></div><div class="badges">'+r.badges.map(b=>'<button class="badge '+(st['badge-'+b]?'done':'')+'" onclick="toggleBadge(\''+b+'\')">'+b+'<small>Badge</small></button>').join('')+'</div>'+Object.entries(r.sections).map(([cat,list])=>{const complete=list.filter((_,i)=>st[cat+'-'+i]).length, col=collapsed(cat);return '<div class="section '+(col?'collapsed':'')+'"><button class="section-head" onclick="toggleSection(\''+cat+'\')"><span>'+title(cat)+'</span><span>'+complete+' / '+list.length+' '+(col?'▾':'▴')+'</span></button><div class="section-body"><div class="meta">'+complete+' / '+list.length+' complete</div>'+list.map((text,i)=>{let id=cat+'-'+i;return '<label class="task '+(st[id]?'done':'')+'"><input type="checkbox" '+(st[id]?'checked':'')+' onchange="toggleTask(\''+id+'\')"><span>'+text+'</span></label>'}).join('')+'</div></div>'}).join('')+'<div class="actions"><button class="btn gold" onclick="saveSnapshot()">Save HOF Snapshot</button><button class="btn secondary" onclick="addBinderCard()">Add to Binder</button><button class="btn danger" onclick="clearRegion()">Clear Region</button></div></div>');$('version').onchange=e=>{let s=read(saveKey(active),{});s.version=e.target.value;write(saveKey(active),s);toast('Version saved')};$('starter').onchange=e=>{let s=read(saveKey(active),{});s.starter=e.target.value;write(saveKey(active),s);toast('Starter saved')}}
function collapseAll(v){let c=read(KEYS.collapsed,{});Object.keys(REGIONS[active].sections).forEach(k=>c[active+'-'+k]=v);write(KEYS.collapsed,c);run()}function toggleTask(id){let s=read(saveKey(active),{});s[id]=!s[id];write(saveKey(active),s);toast('Saved');run()}function toggleBadge(b){let s=read(saveKey(active),{});s['badge-'+b]=!s['badge-'+b];write(saveKey(active),s);toast('Badge saved');run()}function clearRegion(){if(confirm('Clear '+REGIONS[active].name+' progress only?')){localStorage.removeItem(saveKey(active));run();toast('Region cleared')}}
function payload(){const r=REGIONS[active],st=read(saveKey(active),{}),tasks=allTasks(r),done=tasks.filter(t=>st[t.id]).length,badges=r.badges.filter(b=>st['badge-'+b]);return{region:r.id,regionName:r.name,game:st.version||r.title,starter:st.starter||'Unset',badges,taskCount:done,totalTasks:tasks.length,date:new Date().toISOString()}}
function saveSnapshot(){const name=prompt('Trainer name?','Trainer')||'Trainer',team=(prompt('Champion team, comma-separated?','')||'').split(',').map(x=>x.trim()).filter(Boolean);let entries=read(KEYS.hof,[]);entries.unshift({...payload(),id:Date.now(),trainer:name,team});write(KEYS.hof,entries);toast('HOF snapshot saved')}
function addBinderCard(){let cards=read(KEYS.binder,[]);cards.unshift({...payload(),id:Date.now(),kind:'binder'});write(KEYS.binder,cards);toast('Binder card added')}
function filterButtons(kind,cur){return '<div class="filters"><button class="filter '+(cur==='all'?'active':'')+'" onclick="setFilter(\''+kind+'\',\'all\')">All</button>'+Object.values(REGIONS).map(r=>'<button class="filter '+(cur===r.id?'active':'')+'" onclick="setFilter(\''+kind+'\',\''+r.id+'\')">'+r.name+'</button>').join('')+'</div>'}function setFilter(kind,id){if(kind==='hof')hofFilter=id;else binderFilter=id;render()}
function delHof(id){if(confirm('Delete this HOF entry?')){write(KEYS.hof,read(KEYS.hof,[]).filter(x=>x.id!==id));hof();toast('HOF entry deleted')}}function delBinder(id){if(confirm('Delete this Binder card?')){write(KEYS.binder,read(KEYS.binder,[]).filter(x=>x.id!==id));binder();toast('Binder card deleted')}}
function hof(){let e=read(KEYS.hof,[]),shown=e.filter(x=>hofFilter==='all'||x.region===hofFilter);shell('<div class="panel"><div class="panel-head"><div><div class="kicker">Shared engine</div><div class="panel-title">Hall of Fame Archive</div></div><div class="count-pill">'+shown.length+' / '+e.length+'</div></div><div class="note">Entries are region-tagged payloads. Filters and delete controls are now active.</div>'+filterButtons('hof',hofFilter)+(shown.length?shown.map(x=>'<div class="entry"><b>'+x.trainer+' · '+x.regionName+'</b><br><small>'+x.game+' · Starter: '+x.starter+' · Badges: '+x.badges.length+' · Tasks: '+x.taskCount+'/'+x.totalTasks+'</small><div class="pillrow">'+(x.team||[]).map(p=>'<span class="pill">'+p+'</span>').join('')+'</div><div class="entry-actions"><button class="btn secondary mini" onclick="go(\'run\',\''+x.region+'\')">Open Region</button><button class="btn danger mini" onclick="delHof('+x.id+')">Delete</button></div></div>').join(''):'<div class="empty"><b>No HOF entries yet.</b><br>Save a snapshot from a region checklist.</div>')+'</div>')}
function binder(){let e=read(KEYS.binder,[]),shown=e.filter(x=>binderFilter==='all'||x.region===binderFilter);shell('<div class="panel"><div class="panel-head"><div><div class="kicker">Shared engine</div><div class="panel-title">HOF Binder</div></div><div class="count-pill">'+shown.length+' / '+e.length+'</div></div>'+filterButtons('binder',binderFilter)+'<div class="grid">'+(shown.map(x=>'<div class="card"><h3>'+x.regionName+' Card</h3><p>'+x.game+'</p><div class="pillrow"><span class="pill">'+x.badges.length+' badges</span><span class="pill">'+x.taskCount+'/'+x.totalTasks+' tasks</span><span class="pill">'+x.starter+'</span></div><div class="entry-actions"><button class="btn secondary mini" onclick="go(\'run\',\''+x.region+'\')">Open Region</button><button class="btn danger mini" onclick="delBinder('+x.id+')">Delete</button></div></div>').join('')||'<div class="card"><h3>No cards yet</h3><p>Add one from a region checklist.</p></div>')+'</div></div>')}
function credits(){shell('<div class="panel"><div class="panel-title">Credits / Tribute</div><p class="note">Unofficial fan-made educational tracker. Pokémon, game titles, badges, and related IP belong to Nintendo, Creatures, GAME FREAK, and The Pokémon Company.</p><p class="note">This rebuild honors the original spirit of collecting, trading, playground rumors, link cable completions, Hall of Fame teams, and the long journey from Kanto to every future region.</p></div>')}
function options(){shell('<div class="panel"><div class="panel-title">Options / Data Tools</div><div class="actions"><button class="btn gold" onclick="exportData()">Load / Export All Data</button><button class="btn secondary" onclick="importData()">Import Data</button><button class="btn danger" onclick="resetAll()">Reset All</button></div><textarea id="dataBox" rows="12" placeholder="Export/import data appears here"></textarea><div class="note">V0.15.1 tools include full export/import and reset. Future options can add theme, compact mode, local backup reminders, and debug save-key views.</div></div>')}
function exportData(){let data={active,hof:read(KEYS.hof,[]),binder:read(KEYS.binder,[]),collapsed:read(KEYS.collapsed,{}),regions:{kanto:read(saveKey('kanto'),{}),johto:read(saveKey('johto'),{})}};$('dataBox').value=JSON.stringify(data,null,2);toast('All app data loaded/exported')}function importData(){try{let d=JSON.parse($('dataBox').value);if(d.active&&REGIONS[d.active]){active=d.active;localStorage.setItem(KEYS.active,active)}if(d.hof)write(KEYS.hof,d.hof);if(d.binder)write(KEYS.binder,d.binder);if(d.collapsed)write(KEYS.collapsed,d.collapsed);if(d.regions?.kanto)write(saveKey('kanto'),d.regions.kanto);if(d.regions?.johto)write(saveKey('johto'),d.regions.johto);toast('Data imported')}catch(e){alert('Import failed: invalid JSON')}}function resetAll(){if(confirm('Reset all V0.15 platform data?')){Object.values(KEYS).forEach(k=>localStorage.removeItem(k));localStorage.removeItem(saveKey('kanto'));localStorage.removeItem(saveKey('johto'));active='kanto';menu();toast('All V0.15 data reset')}}
function render(){if(view==='menu')menu();else if(view==='regions')regions();else if(view==='run')run();else if(view==='hof')hof();else if(view==='binder')binder();else if(view==='credits')credits();else if(view==='options')options()}render();
</script></body></html>
