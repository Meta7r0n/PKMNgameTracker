<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PKMN Game Tracker V0.4</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #ffcb05, #3b4cca);
  margin: 0;
  padding: 0;
  color: #222;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
  color: #fff;
}

.container {
  padding: 10px;
}

.section {
  background: #fff;
  border-radius: 12px;
  margin-bottom: 15px;
  padding: 10px;
}

.task {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid #eee;
  padding: 8px 0;
}

.task-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.task input {
  margin-right: 10px;
}

.info {
  font-size: 12px;
  color: #666;
  display: none;
  padding-left: 28px;
}

button {
  border: none;
  background: #3b4cca;
  color: white;
  border-radius: 8px;
  padding: 4px 8px;
}

.progress {
  height: 10px;
  background: #ddd;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 5px;
}

.progress-bar {
  height: 100%;
  background: #ff0000;
  width: 0%;
}

/* Badge Box */
.badge-box {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.badge {
  width: 50px;
  height: 50px;
  background: #ccc;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  text-align: center;
  color: #000;
}

.badge.unlocked {
  background: gold;
}
</style>
</head>

<body>

<header>PKMN Game Tracker V0.4</header>

<div class="container">

  <!-- Badge Box -->
  <div class="section">
    <h3>🏅 Kanto Badge Box</h3>
    <div class="badge-box" id="badgeBox"></div>
  </div>

  <!-- Tasks -->
  <div class="section">
    <h3>📋 Completion Tasks</h3>

    <div class="task">
      <div class="task-row">
        <label><input type="checkbox" data-id="story"> Main Story Complete</label>
        <button onclick="toggleInfo(this)">ⓘ</button>
      </div>
      <div class="info">Defeat Elite Four and Champion</div>
    </div>

    <div class="task">
      <div class="task-row">
        <label><input type="checkbox" data-id="dex"> Regional Dex Complete</label>
        <button onclick="toggleInfo(this)">ⓘ</button>
      </div>
      <div class="info">Catch all Pokémon in the regional Pokédex</div>
    </div>

    <div class="task">
      <div class="task-row">
        <label><input type="checkbox" data-id="mewtwo"> Catch Mewtwo</label>
        <button onclick="toggleInfo(this)">ⓘ</button>
      </div>
      <div class="info">Cerulean Cave post-game legendary</div>
    </div>

    <div class="task">
      <div class="task-row">
        <label><input type="checkbox" data-id="missingno"> MissingNo Encounter</label>
        <button onclick="toggleInfo(this)">ⓘ</button>
      </div>
      <div class="info">Cinnabar coast glitch method</div>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </div>

</div>

<script>
const badges = [
  "Boulder","Cascade","Thunder","Rainbow",
  "Soul","Marsh","Volcano","Earth"
];

const badgeBox = document.getElementById("badgeBox");

badges.forEach(name => {
  const div = document.createElement("div");
  div.className = "badge";
  div.innerText = name;
  div.onclick = () => toggleBadge(name, div);
  badgeBox.appendChild(div);

  if(localStorage.getItem("badge_"+name)){
    div.classList.add("unlocked");
  }
});

function toggleBadge(name, el){
  el.classList.toggle("unlocked");
  if(el.classList.contains("unlocked")){
    localStorage.setItem("badge_"+name, true);
  } else {
    localStorage.removeItem("badge_"+name);
  }
}

function toggleInfo(btn){
  const info = btn.parentElement.nextElementSibling;
  info.style.display = info.style.display === "block" ? "none" : "block";
}

const checkboxes = document.querySelectorAll("input[type=checkbox]");

checkboxes.forEach(cb=>{
  const id = cb.dataset.id;

  if(localStorage.getItem(id)){
    cb.checked = true;
  }

  cb.addEventListener("change", ()=>{
    if(cb.checked){
      localStorage.setItem(id, true);
    } else {
      localStorage.removeItem(id);
    }
    updateProgress();
  });
});

function updateProgress(){
  let total = checkboxes.length;
  let done = 0;

  checkboxes.forEach(cb=>{
    if(cb.checked) done++;
  });

  let percent = (done/total)*100;
  document.getElementById("progressBar").style.width = percent+"%";
}

updateProgress();
</script>

</body>
</html>
